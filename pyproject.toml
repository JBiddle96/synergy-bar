[project]
name = "synergy-bar"
version = "0.1.0"
description = "A tqdm progress bar that narrates itself in corporate jargon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jbiddle", email = "jbiddle96@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["tqdm", "progress-bar", "corporate-jargon", "fun"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "tqdm>=4.70.0",
]

[project.scripts]
synergy-bar = "synergy_bar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
